[metadata]
name = cn-aperture-codec
version = 0.1.0
description = Experimental lossless file transport and certified aperture descriptors
long_description = file: README.md
long_description_content_type = text/markdown
author = Corridor Numerics
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License

[options]
packages = cncodec
python_requires = >=3.9

[options.entry_points]
console_scripts =
    cncodec = cncodec.__main__:main
